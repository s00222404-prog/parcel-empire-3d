services:
  - type: web
    name: parcel-empire-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parcel-empire-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false

  - type: web
    name: parcel-empire-client
    runtime: static
    plan: free
    region: frankfurt
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://parcel-empire-api.onrender.com

databases:
  - name: parcel-empire-db
    plan: free
    region: frankfurt
    databaseName: parcel_empire
    user: parcel_empire_user
